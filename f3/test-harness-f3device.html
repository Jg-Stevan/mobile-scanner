<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F3 — warp + refiner en dispositivo</title>
<style>body{color:#ddd;background:#111;margin:0;padding:12px;font:14px system-ui}.vwrap{width:100%;max-width:640px;position:relative}video{background:#000;width:100%;display:block}canvas.overlay{width:100%;height:100%;position:absolute;inset:0}#ring{width:84px;height:84px}.row{flex-wrap:wrap;align-items:center;gap:8px;margin:8px 0;display:flex}button{font:inherit;margin:4px 4px 4px 0;padding:10px 14px}#shutterBtn{font-size:17px}#toast{color:#eab308;min-height:20px;font-weight:700}#thumb{border:1px solid #444;max-width:320px}#thumbLabel{color:#4c4;font-weight:700}.metrics{grid-template-columns:1fr 1fr;gap:4px;margin:8px 0;display:grid}.metrics div{background:#222;border-radius:6px;padding:6px 8px}.metrics b{color:#4c4}pre{background:#000;max-height:160px;padding:8px;overflow:auto}</style>
  <script type="module" crossorigin src="./assets/test-harness-f3device-8KfDJEKZ.js"></script>
</head>
<body>
<h1>F3 — warp + refiner (harness temporal de dispositivo)</h1>
<div class="vwrap">
  <video id="v" playsinline muted autoplay></video>
  <canvas id="ov" class="overlay" width="640" height="480"></canvas>
</div>
<div class="row">
  <canvas id="ring" width="84" height="84"></canvas>
  <div>
    <button id="shutterBtn">📷 Shutter manual</button>
    <button id="torchBtn">Torch: ?</button>
  </div>
</div>
<div id="toast"></div>
<div id="err" style="color:#f87171;font-weight:700;min-height:20px"></div>
<div class="metrics">
  <div>Cámara: <b id="mCam">—</b></div>
  <div>Estado: <b id="mState">—</b></div>
  <div>FPS: <b id="mFps">—</b></div>
  <div>Contornos: <b id="mCont">—</b></div>
  <div>Capturas: <b id="mCap">0</b></div>
  <div>Refinado: <b id="mRef">—</b></div>
  <div>Salida: <b id="mOut">—</b></div>
  <div>DPI (si carta): <b id="mDpi">—</b></div>
</div>
<div><span id="thumbLabel">WARPED</span> (última captura):<br><canvas id="thumb" width="320" height="240"></canvas></div>
<div class="row">
  <button id="toggleBtn">Ver: WARPED</button>
  <button id="dlBtn">Descargar PNG</button>
</div>
<pre id="out">…</pre>
</body>
</html>
