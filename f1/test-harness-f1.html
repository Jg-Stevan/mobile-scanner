<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F1 — detector + overlay (harness de dispositivo)</title>
<style>body{color:#ddd;background:#111;margin:0;padding:12px;font:14px system-ui}.vwrap{width:100%;max-width:640px;position:relative}video{background:#000;width:100%;display:block}canvas.overlay{width:100%;height:100%;position:absolute;inset:0}.metrics{grid-template-columns:1fr 1fr;gap:4px;margin:8px 0;display:grid}.metrics div{background:#222;border-radius:6px;padding:6px 8px}.metrics b{color:#4c4}button{font:inherit;margin:4px 4px 4px 0;padding:8px 12px}pre{background:#000;max-height:200px;padding:8px;overflow:auto}#status{margin:8px 0;font-weight:700}</style>
  <script type="module" crossorigin src="./assets/test-harness-f1-BsoJKhU6.js"></script>
</head>
<body>
<h1>F1 — detector en vivo (harness temporal de validación)</h1>
<div class="vwrap">
  <video id="v" playsinline muted autoplay></video>
  <canvas id="ov" class="overlay" width="640" height="480"></canvas>
</div>
<div id="status">boot…</div>
<div>
  <button id="torchBtn">Torch: ?</button>
  <span id="torchMsg"></span>
</div>
<div class="metrics">
  <div>Cámara: <b id="mCam">—</b></div>
  <div>Track: <b id="mTrack">—</b></div>
  <div>FPS detección: <b id="mFps">—</b></div>
  <div>Latencia overlay p95: <b id="mLat">—</b> ms</div>
  <div>Quad: <b id="mQuad">—</b></div>
  <div>Hint: <b id="mHint">—</b></div>
</div>
<pre id="out">…</pre>
</body>
</html>
